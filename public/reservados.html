<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logo_ucc.png">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/reservados.css">
    <title>Mis Reservas - SGR UCC</title>
</head>
<body>

    <!-- Navbar compartido -->
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="assets/images/logo_ucc.png" alt="Logo UCC" class="navbar-logo">
            <span class="navbar-title">SGR Reservas</span>
        </div>
        <div class="navbar-links">
            <a href="index.html" class="nav-link">Inicio</a>
            <a href="reservas.html" class="nav-link">Reservar</a>
            <a href="reservados.html" class="nav-link active">Mis Reservas</a>
        </div>
        <button class="navbar-hamburger" id="navbar-hamburger" aria-label="Menú">
            <span></span><span></span><span></span>
        </button>
        <div class="navbar-mobile" id="navbar-mobile">
            <a href="index.html" class="nav-link-mobile">Inicio</a>
            <a href="reservas.html" class="nav-link-mobile">Reservar</a>
            <a href="reservados.html" class="nav-link-mobile active">Mis Reservas</a>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="reservados-main">

        <!-- Barra de titulo y contador -->
        <div class="reservados-titulo">
            <h1>Mis Reservas</h1>
            <span class="reservados-count" id="header-count"></span>
        </div>

        <!-- Filtros -->
        <div class="filtros-bar">
            <input type="text" class="filtro-busqueda" id="filtro-busqueda" placeholder="Buscar por actividad o solicitante...">
            <select class="filtro-sala" id="filtro-sala">
                <option value="">Todas las salas</option>
                <option value="sala1">Sala 1</option>
                <option value="sala2">Sala 2</option>
                <option value="sala3">Sala 3</option>
            </select>
            <button class="filtro-limpiar" id="filtro-limpiar" hidden>Limpiar filtros</button>
        </div>

        <!-- Estado vacio -->
        <div class="estado-vacio" id="estado-vacio" hidden>
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <h2>No hay reservas</h2>
            <p>No se encontraron reservas con los filtros aplicados.</p>
            <a href="reservas.html" class="btn-primary">Hacer una reserva</a>
        </div>

        <!-- Lista de reservas -->
        <div class="reservas-grid" id="contenedor"></div>

        <!-- Paginacion -->
        <nav class="paginacion" id="paginacion" hidden>
            <button class="pag-btn" id="pag-prev" aria-label="Anterior">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <div class="pag-numeros" id="pag-numeros"></div>
            <button class="pag-btn" id="pag-next" aria-label="Siguiente">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </nav>

    </main>

    <script src="js/navbar.js"></script>
    <script src="js/reservados.js"></script>
</body>
</html>
